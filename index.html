<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chúc Mừng 20/10</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #ff4b6e; font-size: 28px; margin-bottom: 10px; }
        p { color: #555; font-size: 16px; line-height: 1.6; }
        .heart {
            font-size: 50px;
            animation: beat 1s infinite alternate;
        }
        @keyframes beat {
            to { transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">💖</div>
        <h1>Happy 20/10!</h1>
        <p>Chúc bạn (hoặc một nửa thế giới) luôn giữ mãi nụ cười trên môi, gặt hái được nhiều thành công và có một ngày lễ thật trọn vẹn, hạnh phúc bên những người thân yêu!</p>
    </div>
</body>
</html>
