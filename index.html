<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10!</title>
    <!-- Nhúng Google Fonts tiếng Việt: Phông chữ viết tay nghệ thuật và phông chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Thư viện pháo hoa canvas-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Khung Thiệp Chúc Mừng */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(150, 20, 60, 0.25);
            text-align: center;
            max-width: 680px;
            width: 100%;
            z-index: 10;
            margin-bottom: 30px;
            border: 3px solid rgba(255, 255, 255, 0.7);
            animation: morphSquare 8s ease-in-out infinite alternate;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.01);
        }

        @keyframes morphSquare {
            0% {
                border-radius: 40px;
            }
            50% {
                border-radius: 60px 30px 60px 30px / 40px 60px 40px 60px;
            }
            100% {
                border-radius: 35px 55px 35px 55px / 55px 35px 55px 35px;
            }
        }

        .heart {
            font-size: 50px;
            animation: beat 0.9s infinite alternate;
            display: inline-block;
            margin-bottom: 10px;
        }

        @keyframes beat {
            to { transform: scale(1.25); }
        }

        /* Tiêu đề viết tay nghệ thuật */
        h1 {
            font-family: 'Great Vibes', cursive;
            color: #d81b60;
            font-size: 52px;
            margin-bottom: 12px;
            font-weight: normal;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.06);
            line-height: 1.1;
        }

        /* Nội dung lời chúc */
        p.message {
            font-family: 'Montserrat', sans-serif;
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.8;
            padding: 0 10px;
            font-weight: 500;
        }

        /* Khu vực 4 ảnh nằm trên một hàng ngang */
        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            z-index: 10;
            flex-wrap: wrap;
        }

        /* Khung ảnh HÌNH CHỮ NHẬT NGANG TO HƠN (Tỷ lệ 16:9) */
        .photo-frame {
            position: relative;
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            width: 220px;      /* Chiều rộng to hơn */
            height: 165px;     /* Chiều cao hình chữ nhật ngang */
            flex-shrink: 0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .photo-frame:hover {
            transform: scale(1.08) translateY(-6px);
            box-shadow: 0 15px 30px rgba(194, 24, 91, 0.35);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Hiệu ứng Hoa Rơi */
        .flower {
            position: fixed;
            top: -50px;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body>

    <!-- Thiệp Chúc Mừng -->
    <div class="card">
        <div class="heart">💖</div>
        <h1>Happy Women's Day 20/10</h1>
        <p class="message">
            Chúc một nửa thế giới luôn xinh đẹp, rạng rỡ và tràn ngập niềm vui.<br>
            Cảm ơn vì đã luôn mang lại sự dịu dàng và những điều tuyệt vời nhất! 🌸
        </p>
    </div>

    <!-- Bộ sưu tập 4 Ảnh Hình Chữ Nhật Ngang -->
    <div class="gallery">
        <div class="photo-frame">
            <img src="anhnhom1.jpg" alt="Ảnh 1">
        </div>
        <div class="photo-frame">
            <img src="anhnhom2.jpg" alt="Ảnh 2">
        </div>
        <div class="photo-frame">
            <img src="anhnhom3.jpg" alt="Ảnh 3">
        </div>
        <div class="photo-frame">
            <img src="anhnhom4.jpg" alt="Ảnh 4">
        </div>
    </div>

    <script>
        // --- 1. Tạo hiệu ứng hoa rơi ---
        const flowerIcons = ['🌸', '🌺', '🌹', '🌷', '✨', '💖'];
        
        function createFlower() {
            const flower = document.createElement('div');
            flower.classList.add('flower');
            flower.innerText = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
            
            flower.style.left = Math.random() * 100 + 'vw';
            flower.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            const duration = Math.random() * 4 + 3;
            flower.style.animationDuration = duration + 's';
            
            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        setInterval(createFlower, 300);

        // --- 2. Tự động bắn pháo hoa ngay khi vừa mở trang ---
        window.onload = function() {
            var duration = 2.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff4081', '#ffd54f', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff80ab', '#e1bee7', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        };
    </script>
</body>
</html>
